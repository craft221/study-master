# ===========================================
# STUDERA.APP - Docker Compose Production
# ===========================================
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Variables d'environnement requises dans .env (racine) :
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, REDIS_PASSWORD
# ===========================================

services:
  # Caddy - Reverse Proxy + HTTPS automatique
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - studera_network
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_GA_ID=G-94XV284NN7
        - NEXT_PUBLIC_API_URL=https://api.studera.app
        - NEXT_PUBLIC_API_BASE=https://api.studera.app
        - NEXT_PUBLIC_WS_HOST=api.studera.app
        - NEXT_PUBLIC_APP_NAME=Studera
    container_name: frontend
    environment:
      - NEXT_PUBLIC_API_URL=https://api.studera.app
      - NEXT_PUBLIC_API_BASE=https://api.studera.app
      - NEXT_PUBLIC_WS_HOST=api.studera.app
      - NEXT_PUBLIC_APP_NAME=Studera
      - NODE_ENV=production
      - NEXT_PUBLIC_GA_ID=G-94XV284NN7
    depends_on:
      - backend
    restart: always
    networks:
      - studera_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  backend:
    build: ./backend
    container_name: backend
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    restart: always
    networks:
      - studera_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - studera_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  redis:
    image: redis:7-alpine
    container_name: redis
    # maxmemory + eviction policy : limite l'usage Redis a 400M et evicte
    # les cles les moins recemment utilisees (LRU) quand la limite est atteinte.
    # Evite qu'un cache/celery runaway tue la VPS.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required in .env}
      --appendonly yes
      --maxmemory 400mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - studera_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  celery_worker:
    build: ./backend
    container_name: celery_worker
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - studera_network
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G

  celery_beat:
    build: ./backend
    container_name: celery_beat
    command: celery -A app.celery_app beat --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - studera_network
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  flower:
    build: ./backend
    container_name: flower
    command: celery -A app.celery_app flower --port=5555
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - celery_worker
    restart: always
    networks:
      - studera_network
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

networks:
  studera_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  caddy_data:
  caddy_config:
