[pytest]
# Configuration pytest pour Study Master Backend

# Chemins de test
testpaths = tests

# Options par défaut
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Marqueurs personnalisés
markers =
    slow: Tests lents (deselect with '-m "not slow"')
    integration: Tests d'intégration
    unit: Tests unitaires

# Configuration asyncio
asyncio_mode = auto

# Ignorer les avertissements
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Couverture
[coverage:run]
source = app
omit =
    tests/*
    */__pycache__/*
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if TYPE_CHECKING:
    @abstractmethod
