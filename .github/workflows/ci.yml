# ===========================================
# STUDERA.APP - CI/CD Pipeline
# ===========================================
# Déclenché sur push/PR vers main, master, develop
#
# Jobs:
#   1. backend-test   - Tests Python + couverture
#   2. frontend-test  - Lint + tests + build Next.js
#   3. security-scan  - Scan Trivy (vulnérabilités)
#   4. deploy-production - Déploiement SSH sur le VPS
#
# Secrets GitHub requis:
#   - VPS_SSH_KEY       : Clé SSH privée pour se connecter au VPS
#   - VPS_HOST          : IP du serveur (ex: 51.210.244.130)
#   - VPS_USER          : Utilisateur SSH (ex: deploy)
#   - VPS_APP_PATH      : Chemin de l'app (ex: /opt/studera)
# ===========================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ==================== BACKEND TESTS ====================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: studymaster
          POSTGRES_PASSWORD: studymaster
          POSTGRES_DB: studymaster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run tests with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://studymaster:studymaster@localhost:5432/studymaster_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          ENVIRONMENT: test
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing -v || true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ==================== FRONTEND TESTS ====================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linting
        working-directory: frontend
        run: npm run lint || true

      - name: Run tests
        working-directory: frontend
        run: npm test -- --coverage --watchAll=false --passWithNoTests || true

      - name: Build check
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.studera.app
          NEXT_PUBLIC_API_BASE: https://api.studera.app
          NEXT_PUBLIC_WS_HOST: api.studera.app
          NEXT_PUBLIC_APP_NAME: Studera
        run: npm run build

  # ==================== SECURITY SCAN ====================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ==================== DEPLOY TO PRODUCTION ====================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Configurer la clé SSH pour se connecter au VPS
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      # Synchroniser les fichiers vers le VPS (comme deploy.sh)
      - name: Sync files to server
        run: |
          rsync -avz --progress \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.env.local' \
            --exclude '.next' \
            --exclude 'venv' \
            --exclude '*.log' \
            --exclude '.github' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_PATH }}/

      # Déployer via Docker Compose sur le VPS
      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'DEPLOY_SCRIPT'

          cd ${{ secrets.VPS_APP_PATH }}

          echo "=== Pulling latest changes ==="

          echo "=== Building and restarting containers ==="
          # Rebuild et restart sans downtime (les nouveaux containers remplacent les anciens)
          docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

          echo "=== Waiting for services to be ready ==="
          sleep 30

          echo "=== Checking service health ==="
          docker compose -f docker-compose.prod.yml ps

          # Vérifier que le backend répond
          echo "=== Health check ==="
          for i in 1 2 3 4 5; do
            if docker compose -f docker-compose.prod.yml exec -T backend curl -sf http://localhost:8000/api/v1/health > /dev/null 2>&1; then
              echo "✅ Backend is healthy!"
              break
            fi
            echo "Waiting for backend... (attempt $i/5)"
            sleep 10
          done

          # Vérifier que le frontend répond
          for i in 1 2 3; do
            if docker compose -f docker-compose.prod.yml exec -T frontend wget --spider -q http://localhost:3000 2>/dev/null; then
              echo "✅ Frontend is healthy!"
              break
            fi
            echo "Waiting for frontend... (attempt $i/3)"
            sleep 10
          done

          # Nettoyer les anciennes images Docker
          echo "=== Cleaning up old Docker images ==="
          docker image prune -f

          echo "=== Deployment complete! ==="
          DEPLOY_SCRIPT

      # Nettoyer la clé SSH
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
